<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kick TV</title>
<link rel="icon" href="icons/icon-square.png">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
<div id="splash">
  <div class="splash-logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="3.3" height="3.3"/><rect x="3" y="6" width="3.3" height="3.3"/><rect x="3" y="9" width="3.3" height="3.3"/><rect x="3" y="12" width="3.3" height="3.3"/><rect x="3" y="15" width="3.3" height="3.3"/><rect x="3" y="18" width="3.3" height="3.3"/><rect x="6" y="3" width="3.3" height="3.3"/><rect x="6" y="6" width="3.3" height="3.3"/><rect x="6" y="9" width="3.3" height="3.3"/><rect x="6" y="12" width="3.3" height="3.3"/><rect x="6" y="15" width="3.3" height="3.3"/><rect x="6" y="18" width="3.3" height="3.3"/><rect x="9" y="9" width="3.3" height="3.3"/><rect x="9" y="12" width="3.3" height="3.3"/><rect x="12" y="6" width="3.3" height="3.3"/><rect x="12" y="9" width="3.3" height="3.3"/><rect x="12" y="12" width="3.3" height="3.3"/><rect x="12" y="15" width="3.3" height="3.3"/><rect x="15" y="3" width="3.3" height="3.3"/><rect x="15" y="6" width="3.3" height="3.3"/><rect x="15" y="15" width="3.3" height="3.3"/><rect x="15" y="18" width="3.3" height="3.3"/><rect x="18" y="3" width="3.3" height="3.3"/><rect x="18" y="6" width="3.3" height="3.3"/><rect x="18" y="15" width="3.3" height="3.3"/><rect x="18" y="18" width="3.3" height="3.3"/></svg></div>
  <div class="splash-word">kick</div>
  <div class="splash-bar"><i></i></div>
</div>
<div id="app">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="pages"></main>

  <div id="player" class="player hidden">
    <div class="player-stage">
      <div class="video-box"><video id="video" playsinline preload="auto"></video></div>
      <aside id="chat" class="chat hidden">
        <div class="chat-head"><span class="chat-title" data-i18n>Чат</span><span class="chat-state"></span></div>
        <div class="chat-list"></div>
      </aside>
    </div>
    <div class="player-spinner hidden"><div class="spinner"></div></div>
    <div class="player-message hidden"></div>
    <div class="player-osd">
      <div class="osd-top">
        <img class="osd-avatar" alt="">
        <div class="osd-meta">
          <div class="osd-title"></div>
          <div class="osd-sub"></div>
        </div>
      </div>
      <div class="osd-bottom">
        <div class="osd-progress">
          <div class="osd-live-badge" data-i18n>В ЭФИРЕ</div>
          <div class="osd-time osd-time-cur"></div>
          <div class="osd-bar"><div class="osd-bar-buf"></div><div class="osd-bar-fill"></div><div class="osd-bar-knob"></div></div>
          <div class="osd-time osd-time-dur"></div>
        </div>
        <div class="osd-controls"></div>
        <div class="osd-next">
          <div class="osd-next-title"></div>
          <div class="shelf-viewport"><div class="shelf-track" data-group="next"></div></div>
        </div>
      </div>
    </div>
    <div class="player-stats hidden"></div>
    <div class="player-zap hidden"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script>window.APP_V = '1';</script>
<script src="js/vendor/hls.min.js?v=1.5.20"></script>
<script src="js/util.js?v=1"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/kick.js?v=1"></script>
<script src="js/account.js?v=1"></script>
<script src="js/vendor/qrcode.js?v=1.4.4"></script>
<script src="js/nav.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
<script src="js/chat.js?v=1"></script>
<script src="js/player.js?v=1"></script>
<script src="js/pages.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
